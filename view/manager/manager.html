<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员页面 - CS2UTIL</title>
    <style>
        /* 沿用原有页面统一的风格样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root{
            --bg:#0b0c0f;
            --panel:#101218;
            --panel-2:#0e1015;
            --text:#f5f7fa;
            --muted:rgba(245,247,250,.62);
            --line:rgba(245,247,250,.12);
            --shadow:0 18px 60px rgba(0,0,0,.55);
            --radius:16px;
            --ease:cubic-bezier(.2,.8,.2,1);
            --accent: #e63946;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            padding: 20px 0;
            border-bottom: 1px solid var(--line);
            margin-bottom: 30px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: var(--accent);
        }

        /* 权限不足提示框 - 匹配原有页面配色和风格 */
        .permission-container {
            background-color: var(--panel);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 60px 40px;
            max-width: 500px;
            text-align: center;
            margin: 0 auto;
        }

        .permission-text {
            font-size: 18px;
            margin-bottom: 25px;
            line-height: 1.8;
        }

        .back-home {
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s;
        }

        .back-home:hover {
            color: #ff5a67;
            text-decoration: underline;
        }

        /* 管理员页面基础容器 */
        .admin-container {
            display: none;
            width: 100%;
            max-width: 1200px;
            padding: 20px;
            margin: 0 auto;
        }

        .admin-title {
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--line);
        }

        .admin-actions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .admin-card {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 25px;
            transition: transform 0.22s var(--ease), box-shadow 0.22s var(--ease), border-color 0.22s var(--ease);
            cursor: pointer;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .admin-card:hover {
            transform: translateY(-6px);
            border-color: rgba(255, 255, 255, 0.22);
            box-shadow: var(--shadow);
        }

        .card-icon {
            width: 50px;
            height: 50px;
            background-color: rgba(230, 57, 70, 0.1);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
        }

        .card-title {
            font-size: 18px;
            margin-bottom: 10px;
        }

        .card-description {
            color: var(--muted);
            font-size: 14px;
            margin-bottom: 20px;
            flex-grow: 1;
        }

        .card-button {
            display: inline-block;
            background-color: rgba(230, 57, 70, 0.15);
            color: var(--accent);
            border: none;
            border-radius: 8px;
            padding: 8px 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
            align-self: flex-start;
            text-decoration: none;
        }

        .card-button:hover {
            background-color: rgba(230, 57, 70, 0.25);
        }

        /* Toast通知样式 */
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 12px 20px;
            border-radius: 8px;
            color: white;
            font-weight: 500;
            z-index: 10000;
            opacity: 0;
            transform: translateY(-20px);
            transition: all 0.3s ease;
            box-shadow: var(--shadow);
        }
        
        .toast.success {
            background-color: #4caf50;
        }
        
        .toast.error {
            background-color: #e63946;
        }
        
        .toast.info {
            background-color: #2196f3;
        }
        
        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">CS2UTIL 管理员中心</div>
        </header>

        <!-- 权限不足提示 -->
        <div class="permission-container" id="noPermission">
            <p class="permission-text">🚫 您没有管理员权限，无法访问此页面</p>
            <p class="permission-text" style="margin-top: 15px;">请联系系统管理员或 <a href="../index.html" class="back-home">点此返回首页</a></p>
        </div>

        <!-- 管理员页面主体 -->
        <div class="admin-container" id="adminContent">
            <h1 class="admin-title">管理员功能</h1>
            
            <div class="admin-actions">
                <!-- 地图管理卡片 -->
                <div class="admin-card">
                    <div class="card-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M3 7L9 3L15 7L21 3V15L15 11L9 15L3 11V7Z" stroke="#e63946" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M9 3V15" stroke="#e63946" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M15 7V11" stroke="#e63946" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M21 15V21L15 17L9 21L3 17V11" stroke="#e63946" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M9 21V17" stroke="#e63946" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M15 17V13" stroke="#e63946" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <h3 class="card-title">地图管理</h3>
                    <p class="card-description">管理所有地图数据，包括添加新地图、编辑地图信息和删除地图。</p>
                    <a href="map.html" class="card-button">进入管理</a>
                </div>

                <!-- 点位管理卡片 -->
                <div class="admin-card">
                    <div class="card-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M20 10C20 14.4183 12 21 12 21C12 21 4 14.4183 4 10C4 5.58172 7.58172 2 12 2C16.4183 2 20 5.58172 20 10Z" stroke="#e63946" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M12 13C13.6569 13 15 11.6569 15 10C15 8.34315 13.6569 7 12 7C10.3431 7 9 8.34315 9 10C9 11.6569 10.3431 13 12 13Z" stroke="#e63946" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <h3 class="card-title">点位管理</h3>
                    <p class="card-description">管理投掷物点位数据，包括添加新点位、编辑点位信息和删除点位。</p>
                    <a href="position.html" class="card-button">进入管理</a>
                </div>

                <!-- 帖子审核卡片 -->
                <div class="admin-card audit-card">
                    <div class="card-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M9 12L11 14L15 10M12 3C13.3968 3 14.6831 3.43373 15.75 4.18316C17.0154 5.07836 18 6.43373 18 8.2C18 9.96627 17.0154 11.3216 15.75 12.2168C14.6831 12.9663 13.3968 13.4 12 13.4C10.6032 13.4 9.31687 12.9663 8.25 12.2168C6.98462 11.3216 6 9.96627 6 8.2C6 6.43373 6.98462 5.07836 8.25 4.18316C9.31687 3.43373 10.6032 3 12 3Z" stroke="#ffc107" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M12 21C13.3968 21 14.6831 20.5663 15.75 19.8168C17.0154 18.9216 18 17.5663 18 15.8C18 14.0337 17.0154 12.6784 15.75 11.7832C14.6831 11.0337 13.3968 10.6 12 10.6C10.6032 10.6 9.31687 11.0337 8.25 11.7832C6.98462 12.6784 6 14.0337 6 15.8C6 17.5663 6.98462 18.9216 8.25 19.8168C9.31687 20.5663 10.6032 21 12 21Z" stroke="#ffc107" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <h3 class="card-title">帖子审核</h3>
                    <p class="card-description">审核和管理用户提交的帖子内容，确保社区内容质量。</p>
                    <a href="post-audit.html" class="card-button">进入审核</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Toast通知函数
        function showAlert(message, type = 'info') {
            // 创建toast元素
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            
            // 添加到页面
            document.body.appendChild(toast);
            
            // 显示toast
            setTimeout(() => toast.classList.add('show'), 10);
            
            // 3秒后隐藏并移除
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // 核心：校验用户是否为管理员（user_power是否为0）
        function checkAdminPermission() {
            // 从localStorage获取用户权限（沿用原有页面的存储逻辑）
            const userPower = localStorage.getItem('userPower');
            const noPermissionEl = document.getElementById('noPermission');
            const adminContentEl = document.getElementById('adminContent');

            // 判定规则：user_power不为0（或不存在）则无权限
            if (!userPower || userPower !== '0') {
                noPermissionEl.style.display = 'block';
                adminContentEl.style.display = 'none';
            } else {
                // 若为管理员，显示管理员页面
                noPermissionEl.style.display = 'none';
                adminContentEl.style.display = 'block';
            }
        }

        // 页面加载立即校验权限
        window.onload = checkAdminPermission;
    </script>
    <script src="../../assets/js/ai-chat.js"></script>
</body>
</html>
