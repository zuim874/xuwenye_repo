<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的内容 - CS2UTIL</title>
    <style>
    /* 基础样式 - 与index.html保持一致 */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    :root {
        --bg: #0b0c0f;
        --panel: #101218;
        --panel-2: #0e1015;
        --text: #f5f7fa;
        --muted: rgba(245,247,250,.62);
        --line: rgba(245,247,250,.12);
        --shadow: 0 18px 60px rgba(0,0,0,.55);
        --radius: 16px;
        --ease: cubic-bezier(.2,.8,.2,1);
        --accent: #e63946;
    }

    body {
        background: 
            radial-gradient(1200px 600px at 20% 0%, rgba(255,255,255,.06), transparent 60%),
            radial-gradient(900px 600px at 80% 10%, rgba(255,255,255,.04), transparent 55%),
            var(--bg);
        color: var(--text);
        line-height: 1.6;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        -webkit-font-smoothing: antialiased;
    }

    .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 20px;
    }

    /* 导航栏样式 - 与index.html完全一致 */
    header {
        position: sticky;
        top: 0;
        z-index: 50;
        background: rgba(16,18,24,.72);
        backdrop-filter: blur(14px);
        border-bottom: 1px solid var(--line);
        padding: 15px 0;
    }

    .header-content {
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .logo {
        font-size: 18px;
        font-weight: 800;
        letter-spacing: .14em;
        color: var(--text);
        text-decoration: none;
    }

    .nav-links {
        display: flex;
        gap: 20px;
        align-items: center;
    }

    .nav-links a {
        color: var(--muted);
        text-decoration: none;
        padding: 8px 10px;
        border-radius: 10px;
        transition: background-color .18s var(--ease), color .18s var(--ease);
    }

    .nav-links a:hover,
    .nav-links a.active {
        color: var(--text);
        background: rgba(255,255,255,.06);
    }

    /* 用户信息样式 - 与index.html一致 */
    .user-info {
        position: relative;
        cursor: pointer;
    }

    .user-initial {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: rgba(255,255,255,.06);
        border: 1px solid var(--line);
        color: var(--text);
        font-weight: 600;
        font-size: 16px;
        transition: all .18s var(--ease);
    }

    .user-info:hover .user-initial {
        background: rgba(255,255,255,.1);
        border-color: rgba(255,255,255,.22);
        transform: translateY(-1px);
    }

    .user-menu {
        position: absolute;
        top: 100%;
        right: 0;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 10px 0;
        display: none;
        margin-top: 8px;
        min-width: 120px;
        box-shadow: var(--shadow);
        z-index: 100;
        opacity: 0;
        transform: translateY(-10px);
        transition: opacity 0.2s var(--ease), transform 0.2s var(--ease);
    }

    .user-menu.show {
        display: block;
        opacity: 1;
        transform: translateY(0);
    }

    .user-menu button {
        width: 100%;
        padding: 10px 15px;
        background: none;
        border: none;
        color: var(--text);
        cursor: pointer;
        text-align: left;
        transition: background-color .18s var(--ease);
        font-size: 13px;
    }

    .user-menu button:hover {
        background: rgba(230, 57, 70, 0.1);
    }

    /* 主内容区域 */
    .main-content {
        flex: 1;
        padding: 40px 0;
    }

    .page-header {
        margin-bottom: 40px;
        text-align: center;
    }

    .page-title {
        font-size: 32px;
        margin-bottom: 10px;
        color: var(--text);
    }

    .page-subtitle {
        color: var(--muted);
        font-size: 16px;
    }

    /* 个人资料区域 - 使用index.html的卡片样式 */
    .profile-section {
        display: flex;
        align-items: center;
        gap: 30px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 30px;
        margin-bottom: 40px;
        box-shadow: var(--shadow);
        backdrop-filter: blur(10px);
    }

    .profile-avatar {
        width: 150px;
        height: 150px;
        border-radius: 50%;
        background: rgba(255,255,255,.03);
        border: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 64px;
        color: var(--accent);
        font-weight: bold;
    }

    .profile-info {
        flex: 1;
    }

    .profile-name {
        font-size: 30px;
        margin-bottom: 10px;
        color: var(--text);
    }

    .profile-joined {
        color: var(--muted);
        margin-bottom: 20px;
    }

    .profile-stats {
        display: flex;
        gap: 40px;
    }

    .stat-item {
        text-align: center;
    }

    .stat-value {
        font-size: 28px;
        font-weight: bold;
        color: var(--accent);
        margin-bottom: 5px;
    }

    .stat-label {
        font-size: 14px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    /* 我的帖子区域 */
    .my-posts-section {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        overflow: hidden;
        box-shadow: var(--shadow);
        margin-bottom: 40px;
    }

    .section-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 22px 30px;
        background: rgba(255,255,255,.03);
        border-bottom: 1px solid var(--line);
    }

    .section-title {
        font-size: 24px;
        font-weight: bold;
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .new-post-btn {
        background: linear-gradient(135deg, var(--accent) 0%, #c1121f 100%);
        color: white;
        border: none;
        padding: 12px 24px;
        border-radius: var(--radius);
        cursor: pointer;
        font-weight: 600;
        text-decoration: none;
        transition: transform .18s var(--ease), box-shadow .18s var(--ease);
    }

    .new-post-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(230, 57, 70, 0.3);
    }

    .posts-list {
        padding: 20px;
    }

    .post-card {
        background: rgba(255,255,255,.03);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 20px;
        margin-bottom: 20px;
        transition: transform .22s var(--ease), box-shadow .22s var(--ease);
    }

    .post-card:hover {
        transform: translateY(-4px);
        box-shadow: var(--shadow);
    }

    .post-header {
        display: flex;
        justify-content: space-between;
        margin-bottom: 15px;
    }

    .post-author {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .author-avatar {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: rgba(255,255,255,.06);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--accent);
        font-weight: bold;
    }

    .author-info h4 {
        color: var(--text);
        margin-bottom: 3px;
    }

    .post-date {
        color: var(--muted);
        font-size: 14px;
    }

    .post-tags {
        display: flex;
        gap: 8px;
    }

    .post-tag {
        background: rgba(255,255,255,.06);
        padding: 4px 12px;
        border-radius: 12px;
        font-size: 12px;
        color: var(--text);
        border: 1px solid var(--line);
    }

    .post-content h3 {
        color: var(--text);
        margin-bottom: 10px;
        font-size: 20px;
    }

    .post-content p {
        color: var(--muted);
        margin-bottom: 15px;
        line-height: 1.6;
    }

    .post-stats {
        display: flex;
        gap: 20px;
        margin-bottom: 15px;
        color: var(--muted);
        font-size: 14px;
    }

    .post-stat {
        display: flex;
        align-items: center;
        gap: 5px;
    }

    .post-video {
        margin-bottom: 15px;
        border-radius: var(--radius);
        overflow: hidden;
    }

    .post-video video {
        width: 100%;
        max-height: 400px;
        object-fit: cover;
    }

    .post-actions {
        display: flex;
        gap: 10px;
    }

    .edit-btn, .delete-btn {
        padding: 8px 16px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        cursor: pointer;
        font-weight: 500;
        display: flex;
        align-items: center;
        gap: 5px;
        transition: all .18s var(--ease);
    }

    .edit-btn {
        background: rgba(59, 130, 246, 0.1);
        color: #3b82f6;
    }

    .edit-btn:hover {
        background: rgba(59, 130, 246, 0.2);
        transform: translateY(-1px);
    }

    .delete-btn {
        background: rgba(230, 57, 70, 0.1);
        color: var(--accent);
    }

    .delete-btn:hover {
        background: rgba(230, 57, 70, 0.2);
        transform: translateY(-1px);
    }

    /* 状态提示样式 */
    .loading-indicator, .error-message, .empty-message {
        text-align: center;
        padding: 40px 20px;
        color: var(--muted);
        font-size: 16px;
    }

    .loading-indicator::after {
        content: "";
        display: inline-block;
        width: 20px;
        height: 20px;
        border: 3px solid rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        border-top-color: var(--accent);
        animation: spin 1s ease-in-out infinite;
        margin-left: 10px;
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }

    .error-message {
        color: var(--accent);
    }

    /* 页脚样式 - 与index.html一致 */
    footer {
        background: var(--panel);
        padding: 30px 0;
        margin-top: 50px;
        border-top: 1px solid var(--line);
    }

    .footer-content {
        display: flex;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 30px;
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 20px;
    }

    .footer-section {
        flex: 1;
        min-width: 200px;
    }

    .footer-section h3 {
        font-size: 18px;
        margin-bottom: 15px;
        color: var(--text);
    }

    .footer-links {
        list-style: none;
    }

    .footer-links li {
        margin-bottom: 8px;
    }

    .footer-links a {
        color: var(--muted);
        text-decoration: none;
        transition: color .18s var(--ease);
    }

    .footer-links a:hover {
        color: var(--accent);
    }

    .footer-bottom {
        text-align: center;
        margin-top: 30px;
        padding-top: 20px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 14px;
    }

    /* 响应式设计 */
    @media (max-width: 768px) {
        .profile-section {
            flex-direction: column;
            text-align: center;
            padding: 30px 20px;
            gap: 25px;
        }

        .profile-stats {
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .section-header {
            flex-direction: column;
            gap: 15px;
            text-align: center;
            padding: 20px;
        }

        .posts-list {
            padding: 20px;
        }

        .page-title {
            font-size: 28px;
        }
        
        .nav-links {
            gap: 15px;
        }
    }

    @media (max-width: 480px) {
        .profile-avatar {
            width: 120px;
            height: 120px;
            font-size: 48px;
        }

        .profile-name {
            font-size: 26px;
        }

        .stat-value {
            font-size: 24px;
        }

        .section-title {
            font-size: 20px;
        }
        
        .footer-content {
            flex-direction: column;
            gap: 20px;
        }
    }
    </style>
    <link rel="stylesheet" href="post_list.css">
    <link rel="stylesheet" href="avatar.css">
</head>
<body>
    <!-- 导航栏 -->
    <header>
        <div class="container header-content">
            <a href="index.html" class="logo">CS2UTIL</a>
            <div class="nav-links">
                <a href="index.html">首页</a>
                <a href="community.html">社区</a>
                <a href="myinfo.html" class="active">我的</a>
                <div id="userArea" style="display: none;">
                    <div class="user-info">
                        <span class="user-initial" id="userNamePrefix"></span>
                        <div class="user-menu" id="userMenu">
                            <button id="changeEmailBtn">换绑邮箱</button>
                            <button id="changePasswordBtn">更改密码</button>
                            <button id="changeAvatarBtn">设置头像</button>
                            <button id="logoutBtn">登出</button>
                            <button id="deleteAccountBtn">注销</button>
                        </div>
                    </div>
                </div>
                <div id="loginBtnArea">
                    <a href="./account/login.html">登录</a>
                </div>
            </div>
        </div>
    </header>
    
    <!-- 主内容区域 -->
    <div class="container main-content">
        <div class="page-header">
            <h1 class="page-title">我的内容</h1>
            <p class="page-subtitle">管理和查看您发布的所有帖子，跟踪您的社区贡献和互动</p>
        </div>
        
        <!-- 用户资料区域 -->
        <div class="profile-section">
            <div class="profile-avatar" id="profileAvatar">U</div>
            <div class="profile-info">
                <h2 class="profile-name" id="profileName">加载中...</h2>
                <div class="profile-joined" id="profileJoined">注册时间：加载中...</div>
                <div class="profile-stats">
                    <div class="stat-item">
                        <div class="stat-value" id="postCount">0</div>
                        <div class="stat-label">发布帖子</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="likeCount">0</div>
                        <div class="stat-label">获得点赞</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="commentCount">0</div>
                        <div class="stat-label">收到评论</div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 我的帖子区域 -->
        <div class="my-posts-section">
            <div class="section-header">
                <h2 class="section-title">我的帖子</h2>
                <a href="writer.html" class="new-post-btn">发布新帖子</a>
            </div>
            
            <div class="posts-list" id="myPostsList">
                <!-- 帖子列表将由JavaScript动态生成 -->
                <div class="loading-indicator">加载中...</div>
            </div>
        </div>
    </div>
    
    <!-- 页脚 -->
    <footer>
        <div class="container">
            <div class="footer-content">
                <div class="footer-section">
                    <h3>CS2UTIL</h3>
                    <p>提供最全面的CS2实用指南，帮助玩家提升游戏水平。</p>
                </div>
                <div class="footer-section">
                    <h3>快速链接</h3>
                    <ul class="footer-links">
                        <li><a href="index.html">首页</a></li>
                        <li><a href="community.html">社区</a></li>
                        <li><a href="avatar.html">头像设置</a></li>
                    </ul>
                </div>
                <div class="footer-section">
                    <h3>其他链接</h3>
                    <ul class="footer-links">
                        <li><a href="https://www.cs2util.com/player">职业选手设置</a></li>
                        <li><a href="https://www.cs2util.com/crosshairs">准星库</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </footer>
    <script src="user-avatar.js"></script>
    <script src="myinfo.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
        const userId = localStorage.getItem('userId');
        const userName = localStorage.getItem('currentUser');

        const avatar = document.querySelector('.profile-avatar');
        renderUserAvatar(avatar, userId, userName);
        });
</script>
</body>
</html>
