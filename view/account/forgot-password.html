<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS2 Utility Guide - 找回密码</title>
    <style>
        /* 样式保持不变 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root{
            --bg:#0b0c0f;
            --panel:#101218;
            --panel-2:#0e1015;
            --text:#f5f7fa;
            --muted:rgba(245,247,250,.62);
            --line:rgba(245,247,250,.12);
            --shadow:0 18px 60px rgba(0,0,0,.55);
            --radius:16px;
            --ease:cubic-bezier(.2,.8,.2,1);
            --accent:#e63946;
        }

        body {
            background:
                radial-gradient(1200px 600px at 20% 0%, rgba(255,255,255,.06), transparent 60%),
                radial-gradient(900px 600px at 80% 10%, rgba(255,255,255,.04), transparent 55%),
                var(--bg);
            color: var(--text);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        header{
            position: sticky;
            top: 0;
            z-index: 50;
            background: rgba(16,18,24,.72);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--line);
            padding: 15px 0;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo{
            font-size: 18px;
            font-weight: 800;
            letter-spacing: .14em;
            color: var(--text);
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .nav-links a{
            color: var(--muted);
            text-decoration: none;
            padding: 8px 10px;
            border-radius: 10px;
            transition: background-color .18s var(--ease), color .18s var(--ease);
        }

        .nav-links a:hover{
            color: var(--text);
            background: rgba(255,255,255,.06);
        }

        .main-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 0;
        }

        .forgot-container {
            width: 100%;
            max-width: 450px;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 40px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(10px);
        }

        .forgot-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .forgot-title {
            font-size: 28px;
            margin-bottom: 10px;
            color: var(--text);
            font-weight: 600;
        }

        .forgot-subtitle {
            color: var(--muted);
            font-size: 16px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text);
            font-size: 14px;
        }

        .form-input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255,255,255,.03);
            border: 1px solid var(--line);
            border-radius: 12px;
            color: var(--text);
            font-size: 16px;
            transition: all .18s var(--ease);
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(230, 57, 70, 0.2);
            background: rgba(255,255,255,.05);
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all .18s var(--ease);
            margin-top: 10px;
        }

        .submit-btn:hover {
            background: #c1121f;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(230, 57, 70, 0.3);
        }

        .back-login {
            text-align: center;
            margin-top: 25px;
            color: var(--muted);
        }

        .back-login a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
            transition: color .18s var(--ease);
        }

        .back-login a:hover {
            color: #c1121f;
            text-decoration: underline;
        }

        .error-message {
            color: var(--accent);
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }

        .success-message {
            color: #4CAF50;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }

        footer {
            background: rgba(16,18,24,.72);
            backdrop-filter: blur(14px);
            padding: 20px 0;
            text-align: center;
            margin-top: auto;
            border-top: 1px solid var(--line);
        }

        .footer-content {
            color: var(--muted);
            font-size: 14px;
        }

        .cooldown-message {
            color: var(--muted);
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }
        
        .submit-btn:disabled {
            background: rgba(230, 57, 70, 0.5);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .submit-btn:disabled:hover {
            background: rgba(230, 57, 70, 0.5);
            transform: none;
            box-shadow: none;
        }

        @media (max-width: 768px) {
            .forgot-container {
                padding: 30px 20px;
                margin: 0 20px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="container header-content">
            <a href="index.html" class="logo">CS2UTIL</a>
            <div class="nav-links">
                <a href="../index.html">首页</a>
                <a href="../community.html">社区</a>
            </div>
        </div>
    </header>
    
    <div class="main-content">
        <div class="container">
            <div class="forgot-container">
                <div class="forgot-header">
                    <h1 class="forgot-title">找回密码</h1>
                    <p class="forgot-subtitle">请输入您的注册邮箱来重置密码</p>
                </div>
                
                <form id="forgotForm">
                    <div class="form-group">
                        <label for="email" class="form-label">邮箱地址</label>
                        <input type="email" id="email" class="form-input" placeholder="请输入注册邮箱">
                        <div class="error-message" id="emailError">请输入有效的邮箱地址</div>
                    </div>
                    
                    <button type="submit" class="submit-btn">发送重置链接</button>
                    
                    <div class="success-message" id="successMessage">重置链接已发送到您的邮箱，请查收</div>
                </form>
                
                <div class="back-login">
                    <a href="login.html">返回登录</a>
                </div>
            </div>
        </div>
    </div>
    
    <footer>
        <div class="container">
            <div class="footer-content">
                <p>© 2025 CS2 Utility Guide.</p>
            </div>
        </div>
    </footer>

    <script>
        // 存储发送记录的键名
        const COOLDOWN_KEY = 'resetPasswordCooldown';
        const COOLDOWN_TIME = 1 * 60 * 1000; // 1分钟冷却时间
        
        // 邮箱验证正则表达式
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        
        document.getElementById('forgotForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const emailError = document.getElementById('emailError');
            const successMessage = document.getElementById('successMessage');
            const submitBtn = document.querySelector('.submit-btn');
            
            emailError.style.display = 'none';
            successMessage.style.display = 'none';

            // 邮箱格式验证
            if (!email) {
                emailError.textContent = '请输入邮箱地址';
                emailError.style.display = 'block';
                return;
            }
            
            if (!emailRegex.test(email)) {
                emailError.textContent = '请输入有效的邮箱地址';
                emailError.style.display = 'block';
                return;
            }

            // 检查冷却时间
            const cooldownData = getCooldownData();
            const now = Date.now();
            
            if (cooldownData && now - cooldownData.timestamp < COOLDOWN_TIME) {
                const remainingTime = Math.ceil((COOLDOWN_TIME - (now - cooldownData.timestamp)) / 1000);
                alert(`请等待 ${Math.floor(remainingTime / 60)} 分 ${remainingTime % 60} 秒后再试`);
                return;
            }

            try {
                // 禁用按钮防止重复点击
                submitBtn.disabled = true;
                submitBtn.textContent = '发送中...';

                const res = await fetch('/api/users/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                
                const data = await res.json();

                if (!res.ok) {
                    throw new Error(data.message || '发送重置链接失败');
                }

                // 记录发送时间
                setCooldownData();
                
                successMessage.style.display = 'block';
                
                // 显示冷却时间提醒
                showCooldownTimer();
                
            } catch (err) {
                alert(err.message || '服务器内部错误');
            } finally {
                // 重新启用按钮
                submitBtn.disabled = false;
                submitBtn.textContent = '发送重置链接';
            }
        });

        // 获取冷却时间数据
        function getCooldownData() {
            const data = localStorage.getItem(COOLDOWN_KEY);
            return data ? JSON.parse(data) : null;
        }

        // 设置冷却时间数据
        function setCooldownData() {
            const data = {
                timestamp: Date.now()
            };
            localStorage.setItem(COOLDOWN_KEY, JSON.stringify(data));
        }

        // 显示冷却时间倒计时
        function showCooldownTimer() {
            const cooldownData = getCooldownData();
            if (!cooldownData) return;

            const cooldownEnd = cooldownData.timestamp + COOLDOWN_TIME;
            const now = Date.now();
            
            if (now < cooldownEnd) {
                // 创建或显示冷却提示
                let cooldownMessage = document.getElementById('cooldownMessage');
                if (!cooldownMessage) {
                    cooldownMessage = document.createElement('div');
                    cooldownMessage.id = 'cooldownMessage';
                    cooldownMessage.className = 'cooldown-message';
                    document.querySelector('.form-group').appendChild(cooldownMessage);
                }
                
                cooldownMessage.style.display = 'block';
                
                // 更新倒计时
                const updateTimer = () => {
                    const remaining = Math.ceil((cooldownEnd - Date.now()) / 1000);
                    if (remaining <= 0) {
                        cooldownMessage.style.display = 'none';
                        return;
                    }
                    
                    const minutes = Math.floor(remaining / 60);
                    const seconds = remaining % 60;
                    cooldownMessage.textContent = `下次发送还需等待 ${minutes} 分 ${seconds} 秒`;
                    setTimeout(updateTimer, 1000);
                };
                
                updateTimer();
            }
        }

        // 页面加载时检查冷却状态
        document.addEventListener('DOMContentLoaded', function() {
            showCooldownTimer();
        });
    </script>
</body>
</html>
