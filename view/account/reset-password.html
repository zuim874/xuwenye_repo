<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS2 Utility Guide - 重置密码</title>
    <!-- 使用与forgot-password.html相同的样式 -->
    <style>
        /* 使用与login.html相同的样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root{
            --bg:#0b0c0f;
            --panel:#101218;
            --panel-2:#0e1015;
            --text:#f5f7fa;
            --muted:rgba(245,247,250,.62);
            --line:rgba(245,247,250,.12);
            --shadow:0 18px 60px rgba(0,0,0,.55);
            --radius:16px;
            --ease:cubic-bezier(.2,.8,.2,1);
            --accent:#e63946;
        }

        body {
            background:
                radial-gradient(1200px 600px at 20% 0%, rgba(255,255,255,.06), transparent 60%),
                radial-gradient(900px 600px at 80% 10%, rgba(255,255,255,.04), transparent 55%),
                var(--bg);
            color: var(--text);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        header{
            position: sticky;
            top: 0;
            z-index: 50;
            background: rgba(16,18,24,.72);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--line);
            padding: 15px 0;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo{
            font-size: 18px;
            font-weight: 800;
            letter-spacing: .14em;
            color: var(--text);
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .nav-links a{
            color: var(--muted);
            text-decoration: none;
            padding: 8px 10px;
            border-radius: 10px;
            transition: background-color .18s var(--ease), color .18s var(--ease);
        }

        .nav-links a:hover{
            color: var(--text);
            background: rgba(255,255,255,.06);
        }

        .main-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 0;
        }

        .forgot-container {
            width: 100%;
            max-width: 450px;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 40px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(10px);
        }

        .forgot-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .forgot-title {
            font-size: 28px;
            margin-bottom: 10px;
            color: var(--text);
            font-weight: 600;
        }

        .forgot-subtitle {
            color: var(--muted);
            font-size: 16px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text);
            font-size: 14px;
        }

        .form-input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255,255,255,.03);
            border: 1px solid var(--line);
            border-radius: 12px;
            color: var(--text);
            font-size: 16px;
            transition: all .18s var(--ease);
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(230, 57, 70, 0.2);
            background: rgba(255,255,255,.05);
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all .18s var(--ease);
            margin-top: 10px;
        }

        .submit-btn:hover {
            background: #c1121f;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(230, 57, 70, 0.3);
        }

        .back-login {
            text-align: center;
            margin-top: 25px;
            color: var(--muted);
        }

        .back-login a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
            transition: color .18s var(--ease);
        }

        .back-login a:hover {
            color: #c1121f;
            text-decoration: underline;
        }

        .error-message {
            color: var(--accent);
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }

        .success-message {
            color: #4CAF50;
            font-size: 14px;
            margin-top: 15px;
            padding: 12px;
            background-color: rgba(76, 175, 80, 0.1);
            border: 1px solid rgba(76, 175, 80, 0.3);
            border-radius: 12px;
            text-align: center;
            font-weight: 500;
            display: none;
        }

        footer {
            background: rgba(16,18,24,.72);
            backdrop-filter: blur(14px);
            padding: 20px 0;
            text-align: center;
            margin-top: auto;
            border-top: 1px solid var(--line);
        }

        .footer-content {
            color: var(--muted);
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .forgot-container {
                padding: 30px 20px;
                margin: 0 20px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="container header-content">
            <a href="index.html" class="logo">CS2UTIL</a>
            <div class="nav-links">
                <a href="../index.html">首页</a>
                <a href="../community.html">社区</a>
            </div>
        </div>
    </header>
    
    <div class="main-content">
        <div class="container">
            <div class="forgot-container">
                <div class="forgot-header">
                    <h1 class="forgot-title">重置密码</h1>
                    <p class="forgot-subtitle">请输入您的新密码</p>
                </div>
                
                <form id="resetForm">
                    <input type="hidden" id="resetToken">
                    
                    <div class="form-group">
                        <label for="newPassword" class="form-label">新密码</label>
                        <input type="password" id="newPassword" class="form-input" placeholder="请输入新密码（至少6位，包含字母和数字）">
                        <div class="error-message" id="passwordError">密码必须至少6位，包含字母和数字</div>
                    </div>
                    
                    <div class="form-group">
                        <label for="confirmPassword" class="form-label">确认密码</label>
                        <input type="password" id="confirmPassword" class="form-input" placeholder="请再次输入密码">
                        <div class="error-message" id="confirmError">两次输入的密码不一致</div>
                    </div>
                    
                    <button type="submit" class="submit-btn">重置密码</button>
                    
                    <div class="success-message" id="successMessage">密码重置成功</div>
                    <div class="error-message" id="tokenError">重置链接无效或已过期</div>
                </form>
                
                <div class="back-login">
                    <a href="login.html">返回登录</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 从URL获取token
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        
        if (token) {
            document.getElementById('resetToken').value = token;
        } else {
            document.getElementById('tokenError').style.display = 'block';
            document.getElementById('resetForm').style.display = 'none';
        }

        document.getElementById('resetForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const resetToken = document.getElementById('resetToken').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            // 验证密码
            if (!/^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d@$!%*#?&]{6,}$/.test(newPassword)) {
                document.getElementById('passwordError').style.display = 'block';
                return;
            }
            
            if (newPassword !== confirmPassword) {
                document.getElementById('confirmError').style.display = 'block';
                return;
            }

            try {
                const res = await fetch('/api/users/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: resetToken, newPassword })
                });
                
                const data = await res.json();

                if (!res.ok) {
                    throw new Error(data.message || '重置密码失败');
                }

                document.getElementById('successMessage').style.display = 'block';
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);
                
            } catch (err) {
                alert(err.message || '服务器内部错误');
            }
        });
    </script>
</body>
</html>
