<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS2 Utility Guide - 用户登录</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root{
        --bg:#0b0c0f;
        --panel:#101218;
        --panel-2:#0e1015;
        --text:#f5f7fa;
        --muted:rgba(245,247,250,.62);
        --line:rgba(245,247,250,.12);
        --shadow:0 18px 60px rgba(0,0,0,.55);
        --radius:16px;
        --ease:cubic-bezier(.2,.8,.2,1);
        --accent:#e63946;
        }

        body {
            background:
                radial-gradient(1200px 600px at 20% 0%, rgba(255,255,255,.06), transparent 60%),
                radial-gradient(900px 600px at 80% 10%, rgba(255,255,255,.04), transparent 55%),
                var(--bg);
            color: var(--text);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* 导航栏样式 - 与index.html保持一致 */
        header{
        position: sticky;
        top: 0;
        z-index: 50;
        background: rgba(16,18,24,.72);
        backdrop-filter: blur(14px);
        border-bottom: 1px solid var(--line);
        box-shadow: none;
        padding: 15px 0;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo{
        font-size: 18px;
        font-weight: 800;
        letter-spacing: .14em;
        color: var(--text);
        text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .nav-links a{
        color: var(--muted);
        text-decoration: none;
        padding: 8px 10px;
        border-radius: 10px;
        transition: background-color .18s var(--ease), color .18s var(--ease);
        }

        .nav-links a:hover{
        color: var(--text);
        background: rgba(255,255,255,.06);
        }

        /* 主内容区域 */
        .main-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 0;
        }

        .login-container {
            width: 100%;
            max-width: 450px;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 40px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(10px);
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-title {
            font-size: 28px;
            margin-bottom: 10px;
            color: var(--text);
            font-weight: 600;
        }

        .login-subtitle {
            color: var(--muted);
            font-size: 16px;
        }

        /* 表单样式 */
        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text);
            font-size: 14px;
        }

        .form-input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255,255,255,.03);
            border: 1px solid var(--line);
            border-radius: 12px;
            color: var(--text);
            font-size: 16px;
            transition: all .18s var(--ease);
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(230, 57, 70, 0.2);
            background: rgba(255,255,255,.05);
        }

        .form-input::placeholder {
            color: var(--muted);
            opacity: 0.7;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all .18s var(--ease);
            margin-top: 10px;
        }

        .login-btn:hover {
            background: #c1121f;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(230, 57, 70, 0.3);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .signup-link {
            text-align: center;
            margin-top: 25px;
            color: var(--muted);
        }

        .signup-link a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
            transition: color .18s var(--ease);
        }

        .signup-link a:hover {
            color: #c1121f;
            text-decoration: underline;
        }

        .error-message {
            color: var(--accent);
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }

        .success-message {
            color: #4CAF50;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }

        /* 页脚样式 */
        footer {
            background: rgba(16,18,24,.72);
            backdrop-filter: blur(14px);
            padding: 20px 0;
            text-align: center;
            margin-top: auto;
            border-top: 1px solid var(--line);
        }

        .footer-content {
            color: var(--muted);
            font-size: 14px;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .login-container {
                padding: 30px 20px;
                margin: 0 20px;
            }
            
            .nav-links {
                gap: 15px;
            }
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 25px 15px;
                margin: 0 10px;
            }
            
            .login-title {
                font-size: 24px;
            }
            
            .form-input {
                padding: 10px 12px;
                font-size: 14px;
            }
        }

        /* 加载动画 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-container {
            animation: fadeIn 0.5s var(--ease);
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <header>
        <div class="container header-content">
            <a href="index.html" class="logo">CS2UTIL</a>
            <div class="nav-links">
                <a href="../index.html">首页</a>
                <a href="../community.html">社区</a>
            </div>
        </div>
    </header>
    
    <!-- 主内容区域 -->
    <div class="main-content">
        <div class="container">
            <div class="login-container">
                <div class="login-header">
                    <h1 class="login-title">用户登录</h1>
                    <p class="login-subtitle">登录以访问您的个性化设置和上传您的内容</p>
                </div>
                
                <form id="loginForm">
                    <div class="form-group">
                        <label for="username" class="form-label">用户名</label>
                        <input type="text" id="username" class="form-input" placeholder="请输入用户名或邮箱">
                        <div class="error-message" id="usernameError">请输入有效的用户名或邮箱</div>
                    </div>
                    
                    <div class="form-group">
                        <label for="password" class="form-label">密码</label>
                        <input type="password" id="password" class="form-input" placeholder="请输入密码">
                        <div class="error-message" id="passwordError">密码不能为空</div>
                    </div>
                    
                    <button type="submit" class="login-btn">登录</button>
                    
                    <div class="success-message" id="loginSuccess">登录成功！正在跳转...</div>
                </form>
                
                <div class="signup-link">
                    还没有账户？ <a href="signup.html">立即注册</a>
                </div>
                <div class="signup-link">
                    <a href="forgot-password.html" class="signup-link">忘记密码？</a>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 页脚 -->
    <footer>
        <div class="container">
            <div class="footer-content">
                <p>© 2025 CS2 Utility Guide.</p>
            </div>
        </div>
    </footer>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        // 获取输入值并重置提示
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        const usernameError = document.getElementById('usernameError');
        const passwordError = document.getElementById('passwordError');
        const loginSuccess = document.getElementById('loginSuccess');
        
        usernameError.style.display = 'none';
        passwordError.style.display = 'none';
        loginSuccess.style.display = 'none';

        // 前端字段校验
        if (!username) {
            usernameError.style.display = 'block';
            return;
        }
        if (!password) {
            passwordError.style.display = 'block';
            return;
        }

        try {
            // 发送登录请求
            const res = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
            });
            
            const data = await res.json();

            if (!res.ok) {
                // 失败逻辑：抛出后端返回的错误信息
                throw new Error(data.message || '登录请求失败');
            }

            // 成功逻辑：存储用户信息 + 跳转页面 + 显示成功提示
            // 注意：根据后端返回结构调整（如果后端返回 {message: "成功", username: "xxx"}，则用 data.username）
            loginSuccess.style.display = 'block'; // 显示登录成功提示（可选）
            console.log('登录成功', data);
            localStorage.setItem('currentUser', data.data.username); // 缓存用户名
            localStorage.setItem('userId', data.data.user_id);
            localStorage.setItem('userPower', data.data.user_power);     // 新增：缓存用户权限
            
            // 启动心跳机制（关键：登录成功后立即启动）
            startHeartbeat();

            // 延迟跳转（让用户看到成功提示，可根据需求调整延迟时间或直接跳转）
            setTimeout(() => {
                window.location.href = '../index.html'; // 跳转到首页
            }, 800);

        } catch (err) {
            // 捕获并处理所有异常
            console.error('登录异常', err);
            // 假设后端返回的错误信息包含在 err.message 中
            const errorMsg = err.message || '服务器内部错误';
            // 可根据业务需求选择显示到某个 error 元素，或统一提示
            alert(errorMsg);
        }
        });

        // 心跳函数（全局定义，登录成功后调用）
        let heartbeatTimer = null; // 保存定时器ID，用于后续清除
        function startHeartbeat() {
        const currentUser = localStorage.getItem('currentUser');
        if (!currentUser) return;

        // 清除已有定时器（避免重复创建）
        if (heartbeatTimer) clearInterval(heartbeatTimer);

        // 每60秒发送一次心跳（可调整频率，如30秒/次）
        heartbeatTimer = setInterval(async () => {
            try {
            await fetch('/api/users/heartbeat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: currentUser })
            });
            // 心跳成功无需提示，失败打印日志
            } catch (err) {
            console.error('心跳请求失败（可能已离线）:', err);
            }
        }, 60 * 1000); // 60秒 = 60*1000毫秒
        }
</script>
</body>
</html>
