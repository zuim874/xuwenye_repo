<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>编辑帖子 - CS2UTIL</title>
    <link rel="stylesheet" href="avatar.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root{
          --bg:#0b0c0f;
          --panel:#101218;
          --panel-2:#0e1015;
          --text:#f5f7fa;
          --muted:rgba(245,247,250,.62);
          --line:rgba(245,247,250,.12);
          --shadow:0 18px 60px rgba(0,0,0,.55);
          --radius:16px;
          --ease:cubic-bezier(.2,.8,.2,1);
          --accent:#e63946;
          --accent-hover:#c1121f;
        }
        
        body {
            background: 
                radial-gradient(1200px 600px at 20% 0%, rgba(255,255,255,.06), transparent 60%),
                radial-gradient(900px 600px at 80% 10%, rgba(255,255,255,.04), transparent 55%),
                var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        
        /* 导航栏样式 - 与index.html保持一致 */
        header {
            position: sticky;
            top: 0;
            z-index: 50;
            background: rgba(16,18,24,.72);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--line);
            padding: 15px 0;
        }
        
        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: .14em;
            color: var(--text);
            text-decoration: none;
        }
        
        .nav-links {
            display: flex;
            gap: 20px;
            align-items: center;
        }
        
        .nav-links a {
            color: var(--muted);
            text-decoration: none;
            padding: 8px 10px;
            border-radius: 10px;
            transition: background-color .18s var(--ease), color .18s var(--ease);
        }
        
        .nav-links a:hover {
            color: var(--text);
            background: rgba(255,255,255,.06);
        }
        
        .nav-links a.active {
            color: var(--accent);
            background: rgba(230, 57, 70, 0.1);
        }
        
        /* 主内容区域 */
        .main-content {
            flex: 1;
            padding: 40px 0;
        }
        
        .page-header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .page-title {
            font-size: 32px;
            margin-bottom: 10px;
            font-weight: 700;
        }
        
        .page-subtitle {
            color: var(--muted);
            font-size: 16px;
        }
        
        /* 表单样式 - 使用index.html的面板风格 */
        .post-form-container {
            background: rgba(255,255,255,.03);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 30px;
            box-shadow: var(--shadow);
            max-width: 800px;
            margin: 0 auto;
            backdrop-filter: blur(10px);
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        .form-label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            font-size: 14px;
            color: var(--text);
        }
        
        .form-input, .form-textarea {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255,255,255,.03);
            border: 1px solid var(--line);
            border-radius: 12px;
            color: var(--text);
            font-size: 16px;
            transition: all .18s var(--ease);
        }
        
        .form-input:focus, .form-textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(230, 57, 70, 0.1);
        }
        
        .form-textarea {
            min-height: 200px;
            resize: vertical;
            line-height: 1.8;
        }
        
        /* 视频上传区域 - 使用现代设计 */
        .video-upload {
            border: 2px dashed var(--line);
            border-radius: var(--radius);
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all .18s var(--ease);
            background: rgba(255,255,255,.02);
        }
        
        .video-upload:hover {
            border-color: var(--accent);
            background: rgba(230, 57, 70, 0.05);
            transform: translateY(-2px);
        }
        
        .video-upload-icon {
            font-size: 48px;
            color: var(--muted);
            margin-bottom: 15px;
            transition: color .18s var(--ease);
        }
        
        .video-upload:hover .video-upload-icon {
            color: var(--accent);
        }
        
        .video-upload-text {
            color: var(--muted);
            margin-bottom: 10px;
            font-size: 16px;
        }
        
        .video-upload-info {
            font-size: 14px;
            color: var(--muted);
            opacity: 0.8;
        }
        
        #videoFile {
            display: none;
        }
        
        .video-preview {
            margin-top: 20px;
            display: none;
        }
        
        .video-preview.active {
            display: block;
            animation: fadeIn 0.3s var(--ease);
        }
        
        .preview-video {
            width: 100%;
            border-radius: var(--radius);
            margin-bottom: 10px;
            border: 1px solid var(--line);
        }
        
        .remove-video {
            color: var(--accent);
            background: none;
            border: 1px solid var(--line);
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 5px;
            margin: 0 auto;
            padding: 8px 16px;
            transition: all .18s var(--ease);
        }
        
        .remove-video:hover {
            background: rgba(230, 57, 70, 0.1);
            transform: translateY(-1px);
        }
        
        /* 标签选择区域 */
        .tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
        }
        
        .tag {
            background: rgba(255,255,255,.03);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            color: var(--text);
            cursor: pointer;
            transition: all .18s var(--ease);
            border: 1px solid var(--line);
        }
        
        .tag:hover {
            background: rgba(255,255,255,.06);
            transform: translateY(-1px);
        }
        
        .tag.selected {
            background: rgba(230, 57, 70, 0.15);
            border-color: rgba(230, 57, 70, 0.4);
            color: var(--accent);
        }
        
        .custom-tag {
            display: flex;
            margin-top: 15px;
            gap: 10px;
        }
        
        .tag-input {
            flex: 1;
        }
        
        .add-tag-btn {
            background: rgba(255,255,255,.03);
            color: var(--text);
            border: 1px solid var(--line);
            padding: 0 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: all .18s var(--ease);
        }
        
        .add-tag-btn:hover {
            background: var(--accent);
            border-color: var(--accent);
            transform: translateY(-1px);
        }
        
        /* 按钮区域 */
        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 15px;
            margin-top: 40px;
        }
        
        .cancel-btn, .submit-btn {
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all .18s var(--ease);
            border: none;
        }
        
        .cancel-btn {
            background: rgba(255,255,255,.03);
            color: var(--text);
            border: 1px solid var(--line);
        }
        
        .cancel-btn:hover {
            background: rgba(255,255,255,.06);
            transform: translateY(-2px);
        }
        
        .submit-btn {
            background: var(--accent);
            color: white;
        }
        
        .submit-btn:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(230, 57, 70, 0.3);
        }
        
        /* 错误提示 */
        .error-message {
            color: var(--accent);
            font-size: 14px;
            margin-top: 5px;
            display: none;
            padding: 8px 12px;
            background: rgba(230, 57, 70, 0.1);
            border-radius: 8px;
            border-left: 3px solid var(--accent);
        }
        
        .error-message.active {
            display: block;
            animation: fadeIn 0.3s var(--ease);
        }
        
        /* 成功提示 */
        .success-message {
            background: rgba(76, 175, 80, 0.15);
            color: #4CAF50;
            text-align: center;
            padding: 15px;
            border-radius: var(--radius);
            margin-bottom: 20px;
            display: none;
            border: 1px solid rgba(76, 175, 80, 0.3);
            border-left: 3px solid #4CAF50;
        }
        
        .success-message.active {
            display: block;
            animation: fadeIn 0.3s var(--ease);
        }
        
        /* 当前视频容器 */
        .current-video {
            margin-bottom: 20px;
            padding: 20px;
            background: rgba(255,255,255,.02);
            border-radius: var(--radius);
            border: 1px solid var(--line);
        }
        
        /* 动画效果 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* 用户信息样式 - 与index.html保持一致 */
        .user-info {
            position: relative;
            cursor: pointer;
        }
        
        .user-initial {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255,255,255,.06);
            border: 1px solid var(--line);
            color: var(--text);
            font-weight: 600;
            font-size: 16px;
            transition: all .18s var(--ease);
        }
        
        .user-info:hover .user-initial {
            background: rgba(255,255,255,.1);
            border-color: rgba(255,255,255,.22);
            transform: translateY(-1px);
        }
        
        .logout-btn, .admin-btn, .myinfo-btn {
            position: absolute;
            top: 100%;
            right: 0;
            background-color: var(--panel);
            border: 1px solid var(--line);
            padding: 10px 15px;
            border-radius: 12px;
            cursor: pointer;
            display: none;
            margin-top: 8px;
            min-width: 100px;
            text-align: center;
            font-size: 13px;
            font-weight: 500;
            color: var(--text);
            transition: all .18s var(--ease);
            box-shadow: var(--shadow);
            z-index: 100;
        }
        
        .logout-btn:hover, .admin-btn:hover, .myinfo-btn:hover {
            background-color: rgba(230, 57, 70, 0.9);
            border-color: rgba(230, 57, 70, 0.9);
            transform: translateY(-1px);
        }
        
        .myinfo-btn {
            top: calc(100% + 45px);
        }
        
        .logout-btn {
            top: calc(100% + 90px);
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .post-form-container {
                padding: 20px;
            }
            
            .form-actions {
                flex-direction: column;
            }
            
            .cancel-btn, .submit-btn {
                width: 100%;
            }
            
            .video-upload {
                padding: 30px 15px;
            }
            
            .video-upload-text {
                font-size: 14px;
            }
            
            .tags-container {
                gap: 8px;
            }
            
            .tag {
                padding: 6px 12px;
                font-size: 13px;
            }
        }
        
        @media (max-width: 480px) {
            .page-title {
                font-size: 24px;
            }
            
            .page-subtitle {
                font-size: 14px;
            }
            
            .post-form-container {
                padding: 15px;
            }
            
            .form-input, .form-textarea {
                padding: 10px 12px;
            }
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <header>
        <div class="container header-content">
            <a href="index.html" class="logo">CS2UTIL</a>
            <div class="nav-links">
                <a href="index.html">首页</a>
                <a href="community.html" class="active">社区</a>
                <a href="myinfo.html">我的</a>
                <div id="userArea" style="display: none;">
                    <div class="user-info">
                        <span class="user-initial" id="userNamePrefix"></span>
                    </div>
                </div>
                <div id="loginBtnArea">
                    <a href="login.html">登录</a>
                </div>
            </div>
        </div>
    </header>
    
    <!-- 主内容区域 -->
    <div class="container main-content">
        <div class="page-header">
            <h1 class="page-title">编辑帖子</h1>
            <p class="page-subtitle">修改你的帖子内容和信息</p>
        </div>
        
        <div class="post-form-container">
            <div class="success-message" id="successMessage">
                帖子更新成功！正在返回我的内容页面...
            </div>
            
            <form id="editPostForm">
                <div class="form-group">
                    <label for="postTitle" class="form-label">标题</label>
                    <input type="text" id="postTitle" class="form-input" placeholder="请输入帖子标题">
                    <div class="error-message" id="titleError">标题不能为空</div>
                </div>
                
                <div class="form-group">
                    <label for="postContent" class="form-label">内容介绍</label>
                    <textarea id="postContent" class="form-textarea" placeholder="请详细描述你的技巧、战术或视频内容..."></textarea>
                    <div class="error-message" id="contentError">内容不能为空</div>
                </div>
                
                <div class="form-group">
                    <label class="form-label">视频</label>
                    <div class="current-video" id="currentVideoContainer" style="margin-bottom: 20px; display: none;">
                        <p style="margin-bottom: 10px; font-size: 14px; color: #a0a0a0;">当前视频：</p>
                        <video class="preview-video" id="currentVideo" controls></video>
                        <button type="button" class="remove-video" id="removeCurrentVideo">
                            <span>移除当前视频</span>
                        </button>
                    </div>
                    
                    <div class="video-upload" id="videoUploadArea">
                        <div class="video-upload-icon">📹</div>
                        <p class="video-upload-text">点击或拖拽视频文件到这里上传新视频</p>
                        <p class="video-upload-info">支持MP4、WebM格式，最大文件大小50MB</p>
                        <input type="file" id="videoFile" accept="video/mp4,video/webm">
                    </div>
                    
                    <div class="video-preview" id="newVideoPreview">
                        <video class="preview-video" id="newPreviewVideo" controls></video>
                        <button type="button" class="remove-video" id="removeNewVideo">
                            <span>移除新视频</span>
                        </button>
                    </div>
                    <div class="error-message" id="videoError">请上传有效的视频文件</div>
                </div>
                
                <div class="form-group">
                    <label class="form-label">标签</label>
                    <p class="video-upload-info">选择相关标签（最多5个）</p>
                    <div class="tags-container" id="tagsContainer">
                        <div class="tag" data-tag="Mirage">Mirage</div>
                        <div class="tag" data-tag="Inferno">Inferno</div>
                        <div class="tag" data-tag="Dust2">Dust2</div>
                        <div class="tag" data-tag="烟雾弹">烟雾弹</div>
                        <div class="tag" data-tag="闪光弹">闪光弹</div>
                        <div class="tag" data-tag="燃烧弹">燃烧弹</div>
                        <div class="tag" data-tag="手雷">手雷</div>
                        <div class="tag" data-tag="战术">战术</div>
                        <div class="tag" data-tag="瞄准">瞄准</div>
                        <div class="tag" data-tag="攻略">攻略</div>
                    </div>
                    
                    <div class="custom-tag">
                        <input type="text" class="form-input tag-input" id="customTagInput" placeholder="添加自定义标签">
                        <button type="button" class="add-tag-btn" id="addTagBtn">添加</button>
                    </div>
                    <div class="error-message" id="tagsError">请至少选择一个标签</div>
                </div>
                
                <div class="form-actions">
                    <button type="button" class="cancel-btn" id="cancelBtn">取消</button>
                    <button type="submit" class="submit-btn" id="submitBtn">更新帖子</button>
                </div>
            </form>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 获取URL中的帖子ID
            const urlParams = new URLSearchParams(window.location.search);
            const postId = urlParams.get('id');
            if (!postId) {
                alert('未找到帖子ID');
                window.location.href = 'myinfo.html';
                return;
            }
            
            // 元素引用
            const videoUploadArea = document.getElementById('videoUploadArea');
            const videoFileInput = document.getElementById('videoFile');
            const videoPreview = document.getElementById('newVideoPreview');
            const previewVideo = document.getElementById('newPreviewVideo');
            const removeVideoBtn = document.getElementById('removeNewVideo');
            const currentVideoContainer = document.getElementById('currentVideoContainer');
            const currentVideo = document.getElementById('currentVideo');
            const removeCurrentVideoBtn = document.getElementById('removeCurrentVideo');
            
            const tags = document.querySelectorAll('.tag');
            const selectedTags = new Set();
            const addTagBtn = document.getElementById('addTagBtn');
            const customTagInput = document.getElementById('customTagInput');
            const tagsContainer = document.querySelector('.tags-container');
            
            // 初始化页面
            checkLoginStatus();
            loadPostData(postId);
            
            // 检查登录状态
            function checkLoginStatus() {
                const currentUser = localStorage.getItem('currentUser');
                const userId = localStorage.getItem('userId');
                
                if (currentUser && userId) {
                    document.getElementById('userArea').style.display = 'block';
                    document.getElementById('loginBtnArea').style.display = 'none';
                    document.getElementById('userNamePrefix').textContent = currentUser.charAt(0).toUpperCase();
                } else {
                    document.getElementById('userArea').style.display = 'none';
                    document.getElementById('loginBtnArea').style.display = 'block';
                    window.location.href = 'login.html';
                }
            }
            
            // 加载帖子数据
            async function loadPostData(postId) {
                try {
                    const userId = localStorage.getItem('userId');
                    const response = await fetch(`/api/users/${userId}/posts/${postId}`, {
                        method: 'GET',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-Login-User-Id': userId
                        }
                    });
                    
                    if (!response.ok) {
                        throw new Error('获取帖子数据失败');
                    }
                    
                    const result = await response.json();
                    if (result.code !== 200 || !result.data) {
                        throw new Error('帖子数据格式异常');
                    }
                    
                    const post = result.data;
                    populatePostForm(post);
                    
                } catch (error) {
                    console.error('加载帖子失败:', error);
                    alert(`加载帖子失败: ${error.message}`);
                    window.location.href = 'myinfo.html';
                }
            }
            
            // 填充表单数据
            function populatePostForm(post) {
                // 填充标题和内容
                document.getElementById('postTitle').value = post.title || '';
                document.getElementById('postContent').value = post.content || '';
                
                // 处理视频
                if (post.video_url) {
                    currentVideo.src = post.video_url;
                    currentVideoContainer.style.display = 'block';
                }
                
                // 处理标签
                if (post.tags) {
                    const postTags = post.tags.split(',');
                    postTags.forEach(tagText => {
                        tagText = tagText.trim();
                        if (tagText) {
                            selectedTags.add(tagText);
                            
                            // 标记已有标签为选中状态
                            const existingTag = Array.from(tags).find(t => t.getAttribute('data-tag') === tagText);
                            if (existingTag) {
                                existingTag.classList.add('selected');
                            } else {
                                // 添加自定义标签到容器
                                const newTag = createTagElement(tagText);
                                tagsContainer.appendChild(newTag);
                            }
                        }
                    });
                }
            }
            
            // 创建标签元素
            function createTagElement(tagText) {
                const newTag = document.createElement('div');
                newTag.className = 'tag selected';
                newTag.setAttribute('data-tag', tagText);
                newTag.textContent = tagText;
                
                newTag.addEventListener('click', function() {
                    selectedTags.delete(tagText);
                    this.remove();
                });
                
                return newTag;
            }
            
            // 视频上传处理
            videoUploadArea.addEventListener('click', function() {
                videoFileInput.click();
            });
            
            videoFileInput.addEventListener('change', function(e) {
                if (e.target.files.length > 0) {
                    const file = e.target.files[0];
                    previewVideoFile(file);
                }
            });
            
            function previewVideoFile(file) {
                if (!file.type.startsWith('video/')) {
                    showError('videoError', '请上传视频文件');
                    return;
                }
                
                if (file.size > 50 * 1024 * 1024) {
                    showError('videoError', '视频文件不能超过50MB');
                    return;
                }
                
                hideError('videoError');
                
                // 隐藏当前视频，显示新视频预览
                currentVideoContainer.style.display = 'none';
                const fileURL = URL.createObjectURL(file);
                previewVideo.src = fileURL;
                videoPreview.classList.add('active');
            }
            
            // 移除新视频
            removeVideoBtn.addEventListener('click', function() {
                videoPreview.classList.remove('active');
                previewVideo.src = '';
                videoFileInput.value = '';
                
                // 如果有原始视频，重新显示
                if (currentVideo.src) {
                    currentVideoContainer.style.display = 'block';
                }
            });
            
            // 移除当前视频
            removeCurrentVideoBtn.addEventListener('click', function() {
                currentVideoContainer.style.display = 'none';
                currentVideo.src = '';
            });
            
            // 标签选择功能
            tags.forEach(tag => {
                tag.addEventListener('click', function() {
                    const tagValue = this.getAttribute('data-tag');
                    
                    if (selectedTags.has(tagValue)) {
                        selectedTags.delete(tagValue);
                        this.classList.remove('selected');
                    } else if (selectedTags.size < 5) {
                        selectedTags.add(tagValue);
                        this.classList.add('selected');
                    } else {
                        alert('最多只能选择5个标签');
                    }
                    
                    hideError('tagsError');
                });
            });
            
            // 添加自定义标签
            addTagBtn.addEventListener('click', function() {
                const tagText = customTagInput.value.trim();
                
                if (tagText && tagText.length <= 10) {
                    if ([...selectedTags].includes(tagText)) {
                        alert('该标签已被选择');
                        return;
                    }
                    
                    if (selectedTags.size >= 5) {
                        alert('最多只能选择5个标签');
                        return;
                    }
                    
                    const newTag = createTagElement(tagText);
                    tagsContainer.appendChild(newTag);
                    selectedTags.add(tagText);
                    customTagInput.value = '';
                    hideError('tagsError');
                } else if (tagText.length > 10) {
                    alert('标签不能超过10个字符');
                }
            });
            
            // 取消按钮
            document.getElementById('cancelBtn').addEventListener('click', function() {
                if (confirm('确定要取消编辑吗？已修改的内容将会丢失。')) {
                    window.location.href = 'myinfo.html';
                }
            });
            
            // 表单提交
            document.getElementById('editPostForm').addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const title = document.getElementById('postTitle').value.trim();
                const content = document.getElementById('postContent').value.trim();
                const videoFile = videoFileInput.files[0];
                const hasVideo = currentVideo.src || videoFile;
                
                let isValid = true;
                
                if (!title) {
                    showError('titleError');
                    isValid = false;
                } else {
                    hideError('titleError');
                }
                
                if (!content) {
                    showError('contentError');
                    isValid = false;
                } else {
                    hideError('contentError');
                }
                
                if (!hasVideo) {
                    showError('videoError', '请上传视频或保留现有视频');
                    isValid = false;
                } else {
                    hideError('videoError');
                }
                
                if (selectedTags.size === 0) {
                    showError('tagsError');
                    isValid = false;
                } else {
                    hideError('tagsError');
                }
                
                if (!isValid) return;
                
                try {
                    const submitBtn = document.getElementById('submitBtn');
                    submitBtn.disabled = true;
                    submitBtn.textContent = '更新中...';
                    
                    const userId = localStorage.getItem('userId');
                    if (!userId) {
                        throw new Error('未获取到用户信息，请重新登录');
                    }
                    
                    const formData = new FormData();
                    formData.append('title', title);
                    formData.append('content', content);
                    formData.append('tags', Array.from(selectedTags).join(','));
                    // 如果有新视频，添加到表单
                    if (videoFile) {
                        formData.append('video', videoFile);
                    }
                    // 标记是否删除现有视频
                    formData.append('removeExistingVideo', currentVideo.src ? 'false' : 'true');
                    
                    const response = await fetch(`/api/users/${userId}/posts/${postId}`, {
                        method: 'PUT',
                        headers: {
                            'Authorization': `Bearer ${localStorage.getItem('authToken')}`,
                            'X-Login-User-Id': userId
                        },
                        body: formData
                    });
                    
                    const result = await response.json();
                    
                    if (!response.ok) {
                        throw new Error(result.message || '更新失败，请稍后重试');
                    }
                    
                    // 显示成功消息并跳转
                    document.getElementById('successMessage').classList.add('active');
                    setTimeout(() => {
                        window.location.href = 'myinfo.html';
                    }, 3000);
                    
                } catch (error) {
                    console.error('更新帖子失败:', error);
                    alert(`更新失败: ${error.message}`);
                    document.getElementById('submitBtn').disabled = false;
                    document.getElementById('submitBtn').textContent = '更新帖子';
                }
            });
            
            // 错误提示函数
            function showError(elementId, message) {
                const errorElement = document.getElementById(elementId);
                if (errorElement) {
                    if (message) errorElement.textContent = message;
                    errorElement.classList.add('active');
                }
            }
            
            function hideError(elementId) {
                const errorElement = document.getElementById(elementId);
                if (errorElement) {
                    errorElement.classList.remove('active');
                }
            }
        });
    </script>
    <script src="user-avatar.js"></script>
</body>
</html>
