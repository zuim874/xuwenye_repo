<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS2 Utility Guide - 用户注册</title>
    <style>
    /* 基础样式 - 与index.html保持一致 */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    :root {
        --bg: #0b0c0f;
        --panel: #101218;
        --panel-2: #0e1015;
        --text: #f5f7fa;
        --muted: rgba(245,247,250,.62);
        --line: rgba(245,247,250,.12);
        --shadow: 0 18px 60px rgba(0,0,0,.55);
        --radius: 16px;
        --ease: cubic-bezier(.2,.8,.2,1);
        --accent: #e63946;
    }

    body {
        background: 
            radial-gradient(1200px 600px at 20% 0%, rgba(255,255,255,.06), transparent 60%),
            radial-gradient(900px 600px at 80% 10%, rgba(255,255,255,.04), transparent 55%),
            var(--bg);
        color: var(--text);
        line-height: 1.6;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        -webkit-font-smoothing: antialiased;
    }

    .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 20px;
    }

    /* 导航栏样式 - 与index.html完全一致 */
    header {
        position: sticky;
        top: 0;
        z-index: 50;
        background: rgba(16,18,24,.72);
        backdrop-filter: blur(14px);
        border-bottom: 1px solid var(--line);
        padding: 15px 0;
    }

    .header-content {
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .logo {
        font-size: 18px;
        font-weight: 800;
        letter-spacing: .14em;
        color: var(--text);
        text-decoration: none;
    }

    .nav-links {
        display: flex;
        gap: 20px;
        align-items: center;
    }

    .nav-links a {
        color: var(--muted);
        text-decoration: none;
        padding: 8px 10px;
        border-radius: 10px;
        transition: background-color .18s var(--ease), color .18s var(--ease);
    }

    .nav-links a:hover {
        color: var(--text);
        background: rgba(255,255,255,.06);
    }

    /* 主内容区域 */
    .main-content {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 40px 0;
    }

    .signup-container {
        width: 100%;
        max-width: 500px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 40px;
        box-shadow: var(--shadow);
        backdrop-filter: blur(10px);
    }

    .signup-header {
        text-align: center;
        margin-bottom: 30px;
    }

    .signup-title {
        font-size: 28px;
        margin-bottom: 10px;
        color: var(--text);
    }

    .signup-subtitle {
        color: var(--muted);
        font-size: 16px;
    }

    /* 表单样式 - 使用index.html的设计语言 */
    .form-group {
        margin-bottom: 20px;
    }

    .form-label {
        display: block;
        margin-bottom: 8px;
        font-weight: 500;
        color: var(--text);
    }

    .form-input {
        width: 100%;
        padding: 12px 15px;
        background: rgba(255,255,255,.03);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        color: var(--text);
        font-size: 16px;
        transition: all .18s var(--ease);
    }

    .form-input:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 2px rgba(230, 57, 70, 0.2);
    }

    .form-input::placeholder {
        color: var(--muted);
    }

    .password-container {
        position: relative;
    }

    .password-toggle {
        position: absolute;
        right: 15px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        color: var(--muted);
        cursor: pointer;
        font-size: 14px;
        transition: color .18s var(--ease);
    }

    .password-toggle:hover {
        color: var(--text);
    }

    .signup-btn {
        width: 100%;
        padding: 12px;
        background: linear-gradient(135deg, var(--accent) 0%, #c1121f 100%);
        color: white;
        border: none;
        border-radius: var(--radius);
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: transform .18s var(--ease), box-shadow .18s var(--ease);
        margin-top: 10px;
    }

    .signup-btn:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(230, 57, 70, 0.3);
    }

    .signup-btn:active {
        transform: translateY(0);
    }

    .signup-btn:disabled {
        background: rgba(255,255,255,.1);
        cursor: not-allowed;
        transform: none;
        box-shadow: none;
    }

    .login-link {
        text-align: center;
        margin-top: 25px;
        color: var(--muted);
    }

    .login-link a {
        color: var(--accent);
        text-decoration: none;
        font-weight: 500;
        transition: color .18s var(--ease);
    }

    .login-link a:hover {
        color: #c1121f;
        text-decoration: underline;
    }

    .error-message {
        color: var(--accent);
        font-size: 14px;
        margin-top: 5px;
        display: none;
    }

    .success-message {
        background: rgba(76, 175, 80, 0.1);
        color: #4CAF50;
        padding: 12px;
        border-radius: var(--radius);
        font-size: 14px;
        margin-bottom: 20px;
        display: none;
        text-align: center;
        border: 1px solid rgba(76, 175, 80, 0.3);
    }

    /* 页脚样式 - 与index.html一致 */
    footer {
        background: var(--panel);
        padding: 20px 0;
        text-align: center;
        margin-top: auto;
        border-top: 1px solid var(--line);
    }

    .footer-content {
        color: var(--muted);
        font-size: 14px;
    }

    /* 响应式设计 */
    @media (max-width: 768px) {
        .signup-container {
            padding: 30px 20px;
            margin: 0 20px;
        }
        
        .mobile-menu-btn {
            display: block;
            background: none;
            border: none;
            color: var(--text);
            font-size: 24px;
            cursor: pointer;
        }
    }

    @media (max-width: 480px) {
        .signup-container {
            padding: 25px 15px;
        }
        
        .signup-title {
            font-size: 24px;
        }
    }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <header>
        <div class="container header-content">
            <a href="index.html" class="logo">CS2UTIL</a>
            <div class="nav-links">
                <a href="index.html">首页</a>
                <a href="community.html">社区</a>
            </div>
            <button class="mobile-menu-btn">☰</button>
        </div>
    </header>
    
    <!-- 主内容区域 -->
    <div class="main-content">
        <div class="container">
            <div class="signup-container">
                <div class="signup-header">
                    <h1 class="signup-title">创建账号</h1>
                    <p class="signup-subtitle">注册以访问个性化设置和社区功能</p>
                </div>
                
                <div class="success-message" id="successMessage">
                    注册成功！正在跳转至登录页面...
                </div>
                
                <form id="signupForm">
                    <div class="form-group">
                        <label for="username" class="form-label">用户名</label>
                        <input type="text" id="username" class="form-input" placeholder="请输入用户名（3-20个字符）">
                        <div class="error-message" id="usernameError">用户名必须为3-20个字符，只能包含字母、数字和下划线</div>
                    </div>
                    
                    <div class="form-group">
                        <label for="password" class="form-label">密码</label>
                        <div class="password-container">
                            <!-- 占位符改为“至少6位数字” -->
                            <input type="password" id="password" class="form-input" placeholder="请输入密码（至少6位数字）">
                            <button type="button" class="password-toggle" id="togglePassword">显示</button>
                        </div>
                        <!-- 错误提示改为“密码必须至少6位数字” -->
                        <div class="error-message" id="passwordError">密码必须至少6位数字</div>
                    </div>
                    
                    <div class="form-group">
                        <label for="confirmPassword" class="form-label">确认密码</label>
                        <input type="password" id="confirmPassword" class="form-input" placeholder="请再次输入密码">
                        <div class="error-message" id="confirmPasswordError">两次输入的密码不一致</div>
                    </div>

                    <button type="submit" class="signup-btn" id="signupBtn">注册账号</button>
                </form>
                
                <div class="login-link">
                    已有账户？ <a href="login.html">立即登录</a>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 页脚 -->
    <footer>
        <div class="container">
            <div class="footer-content">
                <p>© 2025 CS2 Utility Guide.</p>
            </div>
        </div>
    </footer>

    <script>
document.addEventListener('DOMContentLoaded', function () {
    const form = document.getElementById('signupForm');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const confirmInput = document.getElementById('confirmPassword');
    const togglePasswordBtn = document.getElementById('togglePassword');
    const signupBtn = document.getElementById('signupBtn');
    
    // 错误提示元素
    const usernameError = document.getElementById('usernameError');
    const passwordError = document.getElementById('passwordError');
    const confirmPasswordError = document.getElementById('confirmPasswordError');
    const successMessage = document.getElementById('successMessage');

    // 1. 密码显示/隐藏切换
    togglePasswordBtn.addEventListener('click', function () {
        const type = passwordInput.type === 'password' ? 'text' : 'password';
        passwordInput.type = type;
        confirmInput.type = type; // 同步切换确认密码
        this.textContent = type === 'password' ? '显示' : '隐藏';
    });

    // 2. 完善前端校验函数（密码改为：至少6位数字）
    function validateForm() {
        let isValid = true;
        const username = usernameInput.value.trim();
        const password = passwordInput.value;
        const confirmPassword = confirmInput.value;

        // 用户名校验：3-20字符，仅字母、数字、下划线（保持不变）
        const usernameReg = /^[a-zA-Z0-9_]{3,20}$/;
        if (!username) {
            usernameError.textContent = '用户名不能为空';
            usernameError.style.display = 'block';
            isValid = false;
        } else if (!usernameReg.test(username)) {
            usernameError.textContent = '用户名必须为3-20个字符，只能包含字母、数字和下划线';
            usernameError.style.display = 'block';
            isValid = false;
        } else {
            usernameError.style.display = 'none';
        }

        // 密码校验：改为「至少6位数字」（核心修改）
        const passwordReg = /^\d{6,}$/;
        if (!password) {
            passwordError.textContent = '密码不能为空';
            passwordError.style.display = 'block';
            isValid = false;
        } else if (!passwordReg.test(password)) {
            passwordError.textContent = '密码必须至少6位数字';
            passwordError.style.display = 'block';
            isValid = false;
        } else {
            passwordError.style.display = 'none';
        }

        // 确认密码校验（保持不变：需与密码一致）
        if (password !== confirmPassword) {
            confirmPasswordError.style.display = 'block';
            isValid = false;
        } else {
            confirmPasswordError.style.display = 'none';
        }

        return isValid;
    }

    // 3. 表单提交逻辑（保持不变）
    form.addEventListener('submit', async function (e) {
        e.preventDefault();
        successMessage.style.display = 'none';

        // 前端校验
        if (!validateForm()) return;

        // 构造请求数据（仅用户名和密码）
        const payload = {
            username: usernameInput.value.trim(),
            password: passwordInput.value
        };

        // 按钮状态切换
        signupBtn.disabled = true;
        signupBtn.textContent = '注册中...';

        try {
            // 发送注册请求
            const res = await fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await res.json();

            if (res.ok) {
                // 注册成功：显示提示并跳转
                successMessage.style.display = 'block';
                setTimeout(() => {
                    window.location.href = 'login.html'; // 跳转到登录页
                }, 1500);
            } else {
                // 注册失败：显示后端返回的错误（如用户名已存在）
                alert(data.message || '注册失败，请稍后重试');
            }
        } catch (err) {
            console.error('注册网络错误:', err);
            alert('网络异常，请检查服务器是否启动');
        } finally {
            // 恢复按钮状态
            signupBtn.disabled = false;
            signupBtn.textContent = '注册账号';
        }
    });
});
</script>
</body>
</html>
