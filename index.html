<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>CS2 Utility Guide</title>
    <link rel="stylesheet" href="view/style.css">
</head>
<body>
    <header>
        <div class="header-content">
            <div class="logo">CS2 Utility Guide</div>
            <nav class="nav-links">
                <a href="#">地图</a>
                <a href="#">投掷物</a>
            </nav>
        </div>
    </header>

    <main class="container main-content">
        <!-- 地图选择区 -->
        <section class="map-selection">
            <div class="map-scroll-container">
                <div id="mapsGrid" class="maps-grid">
                    <!-- MapView.renderMapList 会填充这里 -->
                </div>
            </div>
        </section>

        <!-- 地图详情 / 2D 画布 -->
        <section id="map2dContainer" class="map-2d" style="display:none;">
            <button id="backButton" class="back-button">返回</button>
            <h2 id="currentMapTitle" class="page-title"></h2>
            <div id="mapCanvas" class="map-canvas" style="width:100%;height:60vh;"></div>
        </section>
    </main>

    <!-- 模块入口：保证 controller/init.mjs 存在并导入 model/maps.js 与 view/view.js -->
    <script type="module" src="./controller/init.mjs"></script>
</body>
</html>
